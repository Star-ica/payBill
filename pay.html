<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay – PayBill</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="nav"><a class="logo" href="index.html"><i>💳</i><span>PayBill</span></a><div class="links"><a href="index.html" class="">Home</a><a href="pay.html" class="on">Pay</a><a href="payments.html" class="">My payments</a><a href="biller.html" class="">Biller</a><a href="admin.html" class="">Admin</a></div><button class="btn" id="wbtn">Connect wallet</button></nav>
<main class="wrap"><h1>Pay a bill</h1><p class="sub">Choose a biller, then pay now or schedule recurring payments.</p>
<div class="panel"><h2>1. Choose a biller</h2><div class="chips" id="chips"><p class="empty">Loading…</p></div></div>
<div class="panel"><h2>2. Payment details</h2><div class="tabs"><button class="on" data-m="now">Pay now</button><button data-m="sch">Schedule recurring</button></div>
<label>Account / meter / phone reference</label><input id="ref" placeholder="e.g. 0123456789">
<label id="al">Amount (BOT)</label><input id="amt" type="number" step="any" min="0" placeholder="0.00">
<div id="sf" style="display:none"><label>Pay every (days)</label><input id="iv" type="number" min="1" max="365" value="30"><label>Number of payments (1–24)</label><input id="cnt" type="number" min="1" max="24" value="3"><p class="sub" id="tot" style="margin:10px 0 0"></p></div>
<br><button class="btn" id="go">Pay now</button></div></main>
<footer>© 2026 PayBill · Built on BOT Chain<br><a href="https://botchain.ai" target="_blank" rel="noopener">BOT Chain Website</a> · <a href="https://scan.botchain.a" target="_blank" rel="noopener">BOT Chain Explorer</a></footer><div id="toast"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script><script src="js/app.js"></script>
<script>
let sel=null,mode="now",list=[];
(async()=>{
  if(!ro){$("#chips").innerHTML='<div class="notice">Set CONTRACT_ADDRESS in js/app.js</div>';return}
  try{const n=Number(await ro.billerCount());for(let i=0;i<n;i++){const b=await billerOf(i);if(b.active)list.push([i,b])}
    $("#chips").innerHTML=list.map(([i,b])=>`<button class="chip" data-i="${i}">${ICON[b.cat]||"🧾"} ${esc(b.name)}<small>${esc(b.cat)}</small></button>`).join("")||'<p class="empty">No billers available yet.</p>';
    document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{sel=Number(c.dataset.i);document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c))});
  }catch(e){$("#chips").innerHTML='<p class="empty">Could not load billers.</p>'}
})();
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("#sf").style.display=mode==="sch"?"block":"none";$("#al").textContent=mode==="sch"?"Amount per payment (BOT)":"Amount (BOT)";$("#go").textContent=mode==="sch"?"Deposit & schedule":"Pay now";total()});
function total(){const a=Number($("#amt").value),c=Number($("#cnt").value);$("#tot").textContent=mode==="sch"&&a>0&&c>0?"Total deposit: "+(a*c)+" BOT, released "+c+" time(s) every "+$("#iv").value+" day(s). The first payment can be run immediately.":""}
["amt","cnt","iv"].forEach(x=>$("#"+x).oninput=total);
$("#go").onclick=async()=>{
  if(!vault)return toast("Connect your wallet first.",1);
  const ref=$("#ref").value.trim(),a=$("#amt").value;
  if(sel===null)return toast("Choose a biller",1);if(!ref)return toast("Enter your account reference",1);if(!(Number(a)>0))return toast("Enter an amount",1);
  let ok;
  if(mode==="now")ok=await tx(vault.pay(sel,ref,{value:ethers.parseEther(a)}),"Payment sent");
  else{const c=Number($("#cnt").value),d=Number($("#iv").value);if(!(c>=1&&c<=24&&d>=1&&d<=365))return toast("Check the days and number of payments",1);
    ok=await tx(vault.createSchedule(sel,ref,d,c,{value:ethers.parseEther(a)*BigInt(c)}),"Schedule created")}
  if(ok){$("#ref").value="";$("#amt").value=""}
};
</script></body></html>
